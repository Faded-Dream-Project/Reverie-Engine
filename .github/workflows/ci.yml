# ============================================================================
# Reverie Engine — CI.
#
# Runs the full verification chain on every push / PR:
#   1. build            (the only toolchain requirement is cc + make)
#   2. unit tests       (12 suites — display-free; the Wayland suites build
#                        their own fake compositor sockets)
#   3. e2e under Xvfb   (CPU tier always; OpenGL on llvmpipe and Vulkan on
#                        lavapipe when the Mesa packages are installed —
#                        GPU legs SKIP gracefully otherwise)
#   4. ASan + UBSan     (rebuild + unit suite under sanitizers, leak
#                        detection on — catches what -O2 hides)
#   5. FFmpeg matrix     (system: distro dev headers + CLI — the build
#                        compiles against the runner's FFmpeg (6.1), the
#                        ABI guard passes, and the FULL video battery runs;
#                        vendored: runtime libs only — the build falls back
#                        to the bundled 7.1 headers, the ABI guard refuses
#                        video by design, and the stub-refusal contract leg
#                        plus the e2e SKIP legs cover that configuration;
#                        off: ENABLE_FFMPEG=0 — no headers, no linkage, no
#                        video: scenes + CLI + IPC all tested, media mode
#                        refuses with the standard contract, and the
#                        no-header ENABLE_FFMPEG=1 error is verified)
#
# e2e-wayland.sh requires the local weston test stack (../gpulibs) which is
# not reproducible on hosted runners; it runs informationally and always
# exits 0 there (SKIP when the stack is absent).
#
# What CI deliberately does NOT claim: success here is software-renderer
# success. NVIDIA hardware behavior (real WSI FIFO timing, the frame-
# callback starvation characteristics of the maintainer's compositor,
# hardware GPU timer queries) is validated by field runs — see the
# "manual verification" notes in docs/BACKENDS.md.
# ============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ff: [system, vendored, "off"]
    name: build-test (ffmpeg=${{ matrix.ff }})
    steps:
      - uses: actions/checkout@v4

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            mesa-vulkan-drivers \
            libegl1 libegl-mesa0 libgl1-mesa-dri \
            libwayland-client0 \
            libavcodec60 libavformat60 libavutil58 libswscale7

      - name: FFmpeg dev headers + CLI (system-header leg)
        if: matrix.ff == 'system'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            ffmpeg

      - name: build
        run: make -j"$(nproc)" ${{ matrix.ff == 'off' && 'ENABLE_FFMPEG=0' || '' }}

      - name: unit tests
        run: make test ${{ matrix.ff == 'off' && 'ENABLE_FFMPEG=0' || '' }}

      - name: no-FFmpeg verification (stub leg)
        if: matrix.ff == 'off'
        run: |
          # the stub build must carry zero FFmpeg dependency and refuse
          # media mode with the standard contract
          if ldd build/reverie | grep -iE 'libav(codec|format|util)|libswscale'; then
            echo "FAIL: the ENABLE_FFMPEG=0 build links FFmpeg"; exit 1
          fi
          ./build/reverie --scene themes/mountain-dusk/scene.rev -o -s 64x36 -O stub-scene.png
          ./build/reverie --video themes/mountain-dusk/scene.rev 2>&1 | grep -q "no video support" \
            || { echo "FAIL: media mode did not refuse on the stub build"; exit 1; }
          # ENABLE_FFMPEG=1 with NO headers anywhere must be a clear error
          mv contrib /tmp/ff-contrib-hidden
          set +e
          make clean >/dev/null
          ERR=$(make ENABLE_FFMPEG=1 2>&1); RC=$?
          set -e
          mv /tmp/ff-contrib-hidden contrib
          [ "$RC" -ne 0 ] || { echo "FAIL: ENABLE_FFMPEG=1 built without any headers"; exit 1; }
          echo "$ERR" | grep -q "ENABLE_FFMPEG=1 requires" \
            || { echo "FAIL: unclear dependency error: $ERR"; exit 1; }
          make -j"$(nproc)" ENABLE_FFMPEG=0 >/dev/null

      - name: e2e (Xvfb + llvmpipe GL + lavapipe Vulkan)
        run: scripts/e2e.sh

      - name: e2e-wayland (informational; skips without the weston stack)
        run: scripts/e2e-wayland.sh || true

      - name: ASan + UBSan unit pass
        run: |
          make clean
          make -j"$(nproc)" CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" ${{ matrix.ff == 'off' && 'ENABLE_FFMPEG=0' || '' }}
          make test CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" ${{ matrix.ff == 'off' && 'ENABLE_FFMPEG=0' || '' }}

  # ---- distribution portability (Tier 1 + Tier 2 families) ------------------
  # Real containers, real toolchains, real FFmpeg majors: build + unit suite
  # against each distro's own packages, then the no-FFmpeg stub build with
  # its refusal contract. musl is covered by Alpine. e2e stays on the Ubuntu
  # job (Xvfb + Mesa stacks are not worth per-distro images); this job is
  # the BUILD/LINK/RUNTIME-portability evidence.
  distro-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: alpine
            image: "alpine:latest"
            install: "apk add --no-cache git build-base ffmpeg ffmpeg-dev"
          - distro: arch
            image: "archlinux:latest"
            install: "pacman -Sy --noconfirm git base-devel ffmpeg"
          - distro: debian
            image: "debian:latest"
            install: "apt-get update && apt-get install -y --no-install-recommends ca-certificates git build-essential libavcodec-dev libavformat-dev libavutil-dev libswscale-dev"
          - distro: fedora
            image: "fedora:latest"
            # pkgconfig() resolves to runtime-only packages on Fedora; the
            # development headers (full FFmpeg) come from RPM Fusion free
            install: "dnf -y install https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm && dnf -y install git gcc make ffmpeg-devel"
          - distro: opensuse-tumbleweed
            image: "opensuse/tumbleweed:latest"
            install: "zypper -n install git gcc make 'pkgconfig(libavcodec)' 'pkgconfig(libavformat)' 'pkgconfig(libavutil)' 'pkgconfig(libswscale)'"
          - distro: void
            image: "voidlinux/voidlinux:latest"
            install: "mkdir -p /etc/xbps.d && printf 'repository=https://repo-default.voidlinux.org/current\n' > /etc/xbps.d/00-repository-main.conf && xbps-install -Sy xbps && xbps-install -Sy git base-devel ffmpeg-devel"
    name: distro (${{ matrix.distro }})
    container: ${{ matrix.image }}
    steps:
      - name: toolchain
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - name: build + unit tests (system FFmpeg)
        run: |
          make -j"$(nproc)"
          make test
      - name: stub build + unit tests (no FFmpeg)
        run: |
          make clean
          make -j"$(nproc)" ENABLE_FFMPEG=0
          make test ENABLE_FFMPEG=0

      - name: diagnose signal deaths (informational)
        if: always()
        run: |
          # make reports "FAIL build/test_X" without saying WHY; a suite
          # killed by a signal exits 128+N. Re-run each suite once with the
          # exit code visible so hosted-runner crashes classify themselves.
          for t in build/test_*; do
            [ -x "$t" ] || continue
            rc=0
            sh -c "ulimit -c 0; '$t' >/tmp/diag.out 2>&1" || rc=$?
            if [ "$rc" -gt 128 ]; then
              echo "SUITE $t died by signal $((rc-128)); last output:"
              tail -8 /tmp/diag.out
            elif [ "$rc" -ne 0 ]; then
              echo "SUITE $t exited $rc; last output:"
              tail -8 /tmp/diag.out
            fi
          done
